<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutting Edge Landscaping & Snowplowing</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">

    <!-- React, ReactDOM, and Babel for in-browser JSX parsing -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Framer Motion via UMD -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Ensure Framer Motion is loaded
        const { motion, AnimatePresence, useScroll, useTransform, useInView } = window.Motion;
        const { useState, useEffect, useRef } = React;

        const containerVariants = {
            hidden: { opacity: 0 },
            show: {
                opacity: 1,
                transition: { staggerChildren: 0.2 }
            }
        };

        const itemVariants = {
            hidden: { opacity: 0, y: 30 },
            show: { opacity: 1, y: 0, transition: { type: "spring", stiffness: 50 } }
        };

        function Header() {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div style={{ position: 'fixed', width: '100%', zIndex: 1000, top: 0 }}>
                    <div className="top-bar">
                        <div className="container top-bar-container">
                            <a href="tel:4168057642">📞 416-805-7642</a>
                            <a href="mailto:kyle_cuttingedge@hotmail.com">✉️ kyle_cuttingedge@hotmail.com</a>
                        </div>
                    </div>
                    <motion.header 
                        className={`header ${scrolled ? 'scrolled' : ''}`}
                        initial={{ y: -100 }}
                        animate={{ y: 0 }}
                        transition={{ type: "spring", stiffness: 50, damping: 20 }}
                        style={{ position: 'relative' }}
                    >
                        <div className="container nav-container">
                            <div className="logo">
                                <div className="logo-ce">CE</div>
                                <div className="logo-text">
                                    Cutting Edge
                                    <div className="logo-sub">Landscaping & Snowplowing</div>
                                </div>
                            </div>
                            <nav>
                                <ul className="nav-links">
                                    <li><a href="#home">Home</a></li>
                                    <li><a href="#services">About Us</a></li>
                                    <li><a href="#services">Services</a></li>
                                    <li><a href="#partners">Partners</a></li>
                                    <li><motion.a href="#contact" className="nav-cta" whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }}>Get a Free Quote</motion.a></li>
                                </ul>
                            </nav>
                        </div>
                    </motion.header>
                </div>
            );
        }

        function Hero() {
            const [mode, setMode] = useState('summer'); // 'summer' or 'winter'
            const bgImage = mode === 'summer' ? 'url(assets/summer.png)' : 'url(assets/winter.png)';

            return (
                <section id="home" className="hero" style={{ position: 'relative', minHeight: '100dvh', display: 'flex', alignItems: 'center', paddingTop: '120px', paddingBottom: '60px' }}>
                    <AnimatePresence mode="wait">

                            key={mode}
                            className="hero-bg"

                                    style={{

                                        fontFamily: "'Yellowtail', cursive",

                                        marginBottom: '-1rem',
                                        transform: 'rotate(-3deg)',
                                        display: 'inline-block'

                                    animate={{ opacity: 1, y: 0 }}
                                    transition={{ delay: 0.1 }}

                                        fontSize: 'clamp(3rem, 6vw, 4.5rem)',

                                        lineHeight: '1.1', 
                                        marginBottom: '1.5rem',

                                    <button onClick={() => setMode('winter')} style={{ background: mode === 'winter' ? '#519e54' : 'transparent', color: mode === 'winter' ? 'white' : '#fff', border: 'none', padding: '0.8rem 2.5rem', borderRadius: '50px', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer', transition: '0.3s', fontFamily: "'Montserrat', sans-serif" }}>Snowplowing</button>

                            </div>

                                animate={{ opacity: 1, x: 0 }}
                                transition={{ delay: 0.8, type: "spring" }}
                            >
                                <h3>Request a Free Quote</h3>

                                    <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY" />
                                    <div className="form-group">
                                        <input type="text" name="name" className="form-input" placeholder="Full Name" required />
                                    </div>
                                    <div className="form-group">
                                        <input type="tel" name="phone" className="form-input" placeholder="Phone Number" required />
                                    </div>
                                    <div className="form-group">

                                            <option value="hardscaping">Hardscaping</option>
                                            <option value="snowplowing">Snowplowing</option>
                                            <option value="other">Other / Maintenance</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="btn-submit">Get My Quote</button>
                                </form>
                            </motion.div>
                        </div>

            return (

                            </div>

                            <span className="trust-badge-icon">🏆</span>
                            <div>
                                <div style={{ color: '#d4af37' }}>Best of the Best</div>

                            </div>

                            </div>

            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-100px" });

                            className="accent-text"

            const partners = [
                { name: 'Rymar Grass', image: 'assets/raymar grass.png' },

                { name: 'Permacon', image: 'assets/permacon.png' },
                { name: 'Oaks Landscape Products', image: 'assets/oaks.png' },
                { name: 'Banas Stones', image: 'assets/bannas stone.png' },
                { name: 'In-lite', image: 'assets/inlite.png' },
                { name: 'Surefoot Hardscape', image: 'assets/surefoot.png' },
                { name: 'Techo-Bloc', image: 'assets/technobloc.png' },
                { name: 'Unilock', image: 'assets/unilock.png' }

            return (

                        </motion.div>
                        <motion.h2 
                            className="section-title text-center"
                            initial={{ opacity: 0, y: 20 }}
                            animate={isInView ? { opacity: 1, y: 0 } : {}}

                            Our Trusted Partners

                            variants={containerVariants}

                            animate={isInView ? "show" : "hidden"}

                            {partners.map((p, i) => (
                                <motion.div 
                                    key={i} 
                                    className="partner-card"
                                    variants={itemVariants}
                                    whileHover={{ 
                                        scale: 1.05, 
                                        borderColor: "var(--primary-green)",
                                        boxShadow: "0 10px 20px rgba(0,0,0,0.1)"
                                    }}
                                >
                                    <img 
                                        src={p.image} 
                                        alt={p.name} 
                                        className="partner-logo"
                                        style={{ transform: `scale(${p.scale || 1.8})` }}

                                            e.target.style.display = 'none';
                                            e.target.nextSibling.style.display = 'block';
                                        }}
                                    />

                                </motion.div>

                                whileHover={{ scale: 1.05, backgroundColor: "rgba(255,255,255,0.1)", borderColor: "#d4af37" }}
                            >
                                <div className="contact-icon">📞</div>
                                <span>416 805 7642</span>
                            </motion.a>
                            <motion.a 
                                href="https://www.google.com/maps/search/?api=1&query=66+Genthorn+Ave,+Etobicoke,+ON+M9W+2S9" 
                                target="_blank" rel="noopener noreferrer"
                                className="contact-link"
                                variants={itemVariants}
                                whileHover={{ scale: 1.05, backgroundColor: "rgba(255,255,255,0.1)", borderColor: "#d4af37" }}
                            >
                                <div className="contact-icon">📍</div>
                                <span>66 Genthorn Ave, Etobicoke, ON M9W 2S9</span>
                            </motion.a>
                        </motion.div>
                    </div>
                </section>
            );
        }

        function Process() {
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true, margin: "-100px" });

            const steps = [
                { num: '01', sub: 'WE SERVE', title: 'Initial Contact & Consultation', icon: '🗓️' },
                { num: '02', sub: 'WE SERVE', title: 'Site Visit & Assessment', icon: '📍' },
                { num: '03', sub: 'WE SERVE', title: 'Written Proposal', icon: '📝' },
                { num: '04', sub: 'WE SERVE', title: "Project Execution", icon: '🔨' }
            ];

            return (
                <section id="process" className="section bg-navy text-white" ref={ref}>
                    <div className="container text-center">
                        <motion.div 
                            className="accent-text text-center" style={{ color: '#fcf6a7' }}
                            initial={{ opacity: 0, scale: 0.5 }}
                            animate={isInView ? { opacity: 1, scale: 1 } : {}}
                            transition={{ duration: 0.8, type: "spring" }}
                        >
                            How We Work
                        </motion.div>
                        <motion.h2 
                            className="section-title text-center text-white"
                            initial={{ opacity: 0, y: 20 }}
                            animate={isInView ? { opacity: 1, y: 0 } : {}}
                            transition={{ delay: 0.1 }}
                        >
                            Our Process
                        </motion.h2>

                        <div className="process-timeline">
                            <div className="process-line"></div>
                            <div className="process-steps">
                                {steps.map((s, i) => (
                                    <motion.div 
                                        key={i}
                                        className={`process-card ${i % 2 === 0 ? 'down' : 'up'}`}
                                        variants={itemVariants}
                                        initial="hidden"
                                        animate={isInView ? "show" : "hidden"}
                                    >
                                        <div className="step-num">{s.num}</div>
                                        <div className="step-content">
                                            <div className="step-sub">{s.sub}</div>
                                            <div className="step-title">{s.title}</div>
                                        </div>
                                        <div className="step-icon">{s.icon}</div>
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function App() {
            return (
                <div>
                    <Header />
                    <Hero />
                    <TrustBanner />
                    <Services />
                    <Process />
                    <Achievements />
                    <Partners />
                    <Reviews />
                    <Contact />
                    <footer className="bg-navy text-white" style={{ padding: '3rem 0', textAlign: 'center' }}>
                        <div className="container">
                            <h2 style={{ color: 'white', fontFamily: 'Montserrat', fontWeight: 900 }}>CUTTING EDGE</h2>
                            <p>Landscaping & Snowplowing</p>
                            <p style={{ marginTop: '2rem', color: '#a0aab5' }}>&copy; 2004 - 2026 Cutting Edge Landscaping & Snowplowing</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
